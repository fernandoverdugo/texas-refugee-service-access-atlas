# Rebuild full CWS Arapaho service taxonomy
# Retry after seeding CWS service summary
# Retry after seeding CWS normalized mapping
# Rebuild after CWS Dallas provider update
name: Build service-type accessibility

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/service-type-accessibility.yml"
      - "src/analysis/service_types.py"
      - "src/analysis/service_accessibility.py"
      - "scripts/build_service_type_accessibility.py"
      - "data/processed/provider_locations.csv"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

      - name: Build service-type accessibility layer
        run: python -m scripts.build_service_type_accessibility

      - name: Validate service-type outputs
        run: |
          python - <<'PY'
          import pandas as pd

          access = pd.read_csv(
              "data/processed/tract_service_type_accessibility.csv",
              dtype={"geoid": str},
          )
          summary = pd.read_csv(
              "data/processed/service_type_accessibility_summary.csv"
          )
          providers = pd.read_csv(
              "data/processed/provider_service_types.csv"
          )

          expected = {
              "resettlement_case_management",
              "employment",
              "education",
              "health",
              "immigration",
              "cash_benefits",
          }

          assert set(access["service_type"]) == expected
          assert set(summary["service_type"]) == expected
          assert access.groupby("service_type").size().eq(1094).all()
          assert access.groupby("service_type")["geoid"].nunique().eq(1094).all()
          assert providers["provider_id"].nunique() == 8
          assert (summary["provider_locations"] > 0).all()
          assert summary["foreign_born_45m_access_pct"].between(0, 1).all()

          for low, high in [(30, 45), (45, 60)]:
              assert (
                  access[f"service_locations_within_{low}m"]
                  <= access[f"service_locations_within_{high}m"]
              ).all()

          print(summary.to_dict("records"))
          PY

      - name: Commit validated service-type outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/provider_service_types.csv
          git add data/processed/tract_service_type_accessibility.csv
          git add data/processed/service_type_accessibility_summary.csv

          if git diff --cached --quiet; then
            echo "No service-type output changes."
            exit 0
          fi

          git commit -m "Build validated service-type accessibility layer"
          git pull --rebase origin main
          git push origin main
