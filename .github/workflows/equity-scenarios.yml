# Rebuild equity scenarios for corrected CWS Arapaho
# Retry equity scenarios after temporal test update
# Rebuild equity scenarios for CWS Dallas
# Equity scenario optimization build
name: Build equity-aware facility scenarios

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/equity-scenarios.yml"
      - "data/processed/tract_service_accessibility.csv"
      - "data/processed/provider_stop_connectors.csv"

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

      - name: Build equity-aware optimization scenarios
        run: python -m scripts.optimize_equity_scenarios

      - name: Validate scenario outputs
        run: |
          python - <<'PY'
          import pandas as pd

          scenarios = pd.read_csv(
              "data/processed/facility_location_scenarios.csv",
              dtype={"candidate_geoid": str},
          )
          candidates = pd.read_csv(
              "data/processed/facility_location_scenario_candidates.csv",
              dtype={"candidate_geoid": str},
          )

          expected = {
              "foreign_born_population",
              "population",
              "households_no_vehicle",
              "population_below_poverty",
          }

          assert set(scenarios["scenario_id"]) == expected
          assert len(scenarios) == 4
          assert (scenarios["optimized_coverage_pct"] > scenarios["baseline_coverage_pct"]).all()
          assert (scenarios["coverage_gain_pct_points"] > 0).all()
          assert set(candidates["scenario_id"]) == expected
          assert candidates.groupby("scenario_id").size().eq(25).all()

          print(scenarios.to_dict("records"))
          PY

      - name: Commit validated scenario outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/facility_location_scenarios.csv
          git add data/processed/facility_location_scenario_candidates.csv

          if git diff --cached --quiet; then
            echo "No scenario output changes."
            exit 0
          fi

          git commit -m "Build validated equity-aware facility scenarios"
          git pull --rebase origin main
          git push origin main
