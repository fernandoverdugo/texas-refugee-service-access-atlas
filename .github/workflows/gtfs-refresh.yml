name: Refresh DART GTFS data

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

      - name: Download and validate latest DART GTFS
        run: python -m scripts.fetch_dart_gtfs

      - name: Validate processed GTFS layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          summary = pd.read_csv("data/processed/dart_gtfs_summary.csv").iloc[0]
          assert summary["stops"] > 1000
          assert summary["routes"] > 10
          assert summary["trips"] > 100
          assert summary["stop_times"] > 1000

          for name in ["stops.csv", "routes.csv", "trips.csv"]:
              path = Path("data/processed/gtfs") / name
              assert path.exists()
              assert path.stat().st_size > 0

          print(summary.to_dict())
          PY

      - name: Commit validated GTFS core tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/dart_gtfs_summary.csv data/processed/gtfs/

          if git diff --cached --quiet; then
            echo "No GTFS output changes."
            exit 0
          fi

          git commit -m "Refresh validated DART GTFS core tables"
          git pull --rebase origin main
          git push origin main
